spring:
  application:
    name: pool-safety
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pool_safety}
    username: ${DB_USER:pool_safety}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
server:
  port: ${PORT:8080}
  error:
    include-message: never
app:
  jwt-secret: ${JWT_SECRET}
  ai-service-key: ${AI_SERVICE_KEY}
  access-minutes: 15
  refresh-days: 30
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  staff-false-alarm: ${STAFF_FALSE_ALARM:true}
  timezone: ${POOL_TIMEZONE:Asia/Ho_Chi_Minh}
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
